<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E1E2C">
  <meta name="description" content="Airplane Ludo - a custom team Ludo game. Play in your browser.">
  <title>Airplane Ludo</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="assets/fonts/title.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script src="config.js"></script>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>

  <!-- DASHBOARD -->
  <main id="screen-dashboard" class="screen">
    <div class="dash">
      <div class="dash-hero">
        <h1 class="logo grad-text">AIRPLANE LUDO</h1>
        <p class="tagline">A fun board game to play with friends</p>
      </div>

      <div class="dash-menu">
        <div class="name-wrap">
          <span class="person-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2.25c-3.01 0-9 1.51-9 4.5V21h18v-2.25c0-2.99-5.99-4.5-9-4.5z"/></svg>
          </span>
          <label class="field">
            <span class="sr-only">Player name</span>
            <input id="name-input" type="text" maxlength="14" autocomplete="nickname" spellcheck="false" placeholder="PLAYER NAME">
          </label>
        </div>

        <section class="panel">
          <h2 class="grad-text">ONLINE MULTIPLAYER</h2>
          <div class="row">
            <button id="btn-create" class="btn btn-white red">CREATE</button>
            <button id="btn-join" class="btn btn-white blue">JOIN</button>
          </div>
        </section>

        <section class="panel dim">
          <h2 class="grad-text">LOCAL MULTIPLAYER</h2>
          <p class="note">Same-Wi-Fi rooms are hosted from the Android app. On the web, use online rooms.</p>
        </section>

        <div class="row">
          <button id="btn-rules" class="btn btn-dark small">RULES</button>
          <button id="btn-music" class="btn btn-music small" aria-pressed="true">MUSIC</button>
        </div>
      </div>
    </div>
  </main>

  <!-- LOBBY -->
  <main id="screen-lobby" class="screen" hidden></main>

  <!-- GAME -->
  <main id="screen-game" class="screen" hidden></main>

  <!-- JOIN DIALOG -->
  <div id="join-dialog" class="overlay" hidden>
    <div class="dialog">
      <button class="icon-btn close" id="join-close" aria-label="Cancel join room">&times;</button>
      <h2 class="dialog-title">ENTER ROOM CODE</h2>
      <input id="room-input" class="code-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="9" placeholder="XXXX" autocomplete="off">
      <button id="join-go" class="btn btn-white wide">JOIN ROOM</button>
    </div>
  </div>

  <!-- RULES -->
  <div id="rules" class="overlay rules" hidden>
    <div class="rules-head">
      <h2 class="grad-text">RULES</h2>
      <button class="icon-btn close" id="rules-close" aria-label="Close rules">&times;</button>
    </div>
    <div class="rules-body" id="rules-body"></div>
  </div>

  <div id="modal" class="overlay" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
  <noscript><p style="color:#fff;padding:24px">Airplane Ludo needs JavaScript enabled.</p></noscript>
</body>
</html>
